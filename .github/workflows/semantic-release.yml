name: Semantic Release
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  semantic_release:
    # Keep releases explicitly paused during the approved credential cutover.
    if: vars.RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: test
    environment: production
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
    - name: Install
      run: npm ci
    - name: Verify package coverage before deploying
      # Package serving has no CDN fallback: stop the deploy if any request with real
      # traffic would not be served verified from the live release branches.
      run: npm run verify-package-coverage
      env:
        IAB_SPIDER_LIST: ${{ secrets.IAB_SPIDER_LIST }}
    - name: Semantic Release
      run: |
        : "${GITHUB_TOKEN:?GitHub Actions must supply its job token}"
        : "${HLX_FASTLY_AUTH:?Configure the production Fastly token}"
        : "${HLX_CLOUDFLARE_AUTH:?Configure the production Cloudflare token}"
        : "${HLX_CLOUDFLARE_ACCOUNT:?Configure the production Cloudflare account}"
        : "${IAB_SPIDER_LIST:?Configure the licensed production spider list}"
        rm -f release-notes.md
        npm run semantic-release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        # Environment-only secrets; no repository/organization fallback copies.
        HLX_FASTLY_AUTH: ${{ secrets.HLX_FASTLY_AUTH }}
        HLX_CLOUDFLARE_EMAIL: ${{ secrets.HLX_CLOUDFLARE_EMAIL }}
        HLX_CLOUDFLARE_ACCOUNT: ${{ secrets.HLX_CLOUDFLARE_ACCOUNT }}
        HLX_CLOUDFLARE_AUTH: ${{ secrets.HLX_CLOUDFLARE_AUTH }}
        IAB_SPIDER_LIST: ${{ secrets.IAB_SPIDER_LIST }}

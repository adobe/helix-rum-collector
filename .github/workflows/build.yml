name: build
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  push:
    branches-ignore:
      - 'main'

permissions:
  contents: read

jobs:
  test:
    name: Test and build (no deployment)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
    - name: Install
      run: npm ci
    - name: Check release configuration
      run: npm run test-release
    - name: Lint
      run: npm run lint
    - name: Unit Test
      # The licensed spider list is only injected into protected deployments.
      # Its integration test already skips when the list is unavailable.
      run: npm run test && mv lcov.info lcov-junit.info
    - name: Build edge bundle
      run: npm run fastly-build
    - name: Fastly Version
      run: npm ls @fastly/js-compute
    - name: Inspect edge bundle
      # The Fastly tarball is produced during deployment, not by hedy --build.
      run: |
        test -s bin/dist/helix3/helix-rum-collector-edge-bundle.cjs
        unzip -t bin/dist/helix3/helix-rum-collector.zip
        unzip -l bin/dist/helix3/helix-rum-collector.zip
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov-junit.info
